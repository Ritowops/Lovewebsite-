<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Background Music -->
        <audio id="bg-music" src="love-song.mp3" loop preload="auto"></audio>

        <header>
            <h1>For My Love ❤️</h1>
            <button id="music-toggle" onclick="toggleMusic()">🎵 Play Music</button>
        </header>

        <!-- Love Letter Section with Typewriter Effect -->
        <section class="letter-section">
            <div class="letter-card">
                <h2>A Special Message</h2>
                
                <!-- Typewriter Container -->
                <p id="typewriter-text"></p>

                <button id="open-letter-btn" onclick="openSurprise()">Click for a Surprise ✨</button>
            </div>
        </section>

        <!-- Hidden Surprise Message Modal -->
        <div id="surprise-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn" onclick="closeSurprise()">&times;</span>
                <h2>You Mean Everything To Me! 💕</h2>
                <p>No matter where we are, my heart belongs to you.</p>
            </div>
        </div>

        <!-- Photo Gallery Section -->
        <section class="gallery-section">
            <h2>Our Memories</h2>
            <div class="gallery-grid">
                <img src="photo1.jpg" alt="Memory 1">
                <img src="photo2.jpg" alt="Memory 2">
                <img src="photo3.jpg" alt="Memory 3">
                <img src="photo4.jpg" alt="Memory 4">
                <img src="photo5.jpg" alt="Memory 5">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
