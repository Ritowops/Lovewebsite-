<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Background Music -->
        <audio id="bg-music" src="love-song.mp3" loop preload="auto"></audio>

        <header>
            <h1>For My Love ❤️</h1>
            <button id="music-toggle" onclick="toggleMusic()">🎵 Play Music</button>
        </header>

        <!-- Love Letter Section -->
        <section class="letter-section">
            <div class="letter-card">
                <h2>A Special Message</h2>
                <p>
                    Every moment with you is special. Thank you for filling my life with happiness, 
                    warmth, and endless smiles. Here are a few of our favorite memories together!
                </p>
                <button id="open-letter-btn" onclick="openSurprise()">Click for a Surprise ✨</button>
            </div>
        </section>

        <!-- Hidden Surprise Message -->
        <div id="surprise-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeSurprise()">&times;</span>
                <h2>You Mean Everything To Me! 💕</h2>
                <p>No matter where we are, my heart belongs to you.</p>
            </div>
        </div>

        <!-- Photo Gallery Section -->
        <section class="gallery-section">
            <h2>Our Memories</h2>
            <div class="gallery-grid">
                <img src="photo1.jpg" alt="Memory 1" loading="lazy">
                <img src="photo2.jpg" alt="Memory 2" loading="lazy">
                <img src="photo3.jpg" alt="Memory 3" loading="lazy">
                <img src="photo4.jpg" alt="Memory 4" loading="lazy">
                <img src="photo5.jpg" alt="Memory 5" loading="lazy">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script>
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle');
            if (music.paused) {
                music.play().then(() => {
                    btn.textContent = '⏸️ Pause Music';
                }).catch(err => console.log('Audio playback prevented:', err));
            } else {
                music.pause();
                btn.textContent = '🎵 Play Music';
            }
        }

        function openSurprise() {
            document.getElementById('surprise-modal').classList.remove('hidden');
            // Play audio if not playing when surprise button is clicked
            const music = document.getElementById('bg-music');
            if (music.paused) {
                toggleMusic();
            }
        }

        function closeSurprise() {
            document.getElementById('surprise-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
