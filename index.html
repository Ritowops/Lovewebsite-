<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Background Music -->
        <audio id="bg-music" src="love-song.mp3" loop preload="auto"></audio>

        <header>
            <h1>For My Love ❤️</h1>
            <button id="music-toggle" onclick="toggleMusic()">🎵 Play Music</button>
        </header>

        <!-- Love Letter Section -->
        <section class="letter-section">
            <div class="letter-card">
                <h2>A Special Message</h2>
                <p id="typewriter-text"></p>
                <button id="open-letter-btn" onclick="openSurprise()">Click for a Surprise ✨</button>
            </div>
        </section>

        <!-- Hidden Surprise Modal -->
        <div id="surprise-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn" onclick="closeSurprise()">&times;</span>
                <h2> You Mean Everything To Me! 💕</h2>
                <p>No matter where we are, my heart belongs to you.</p>
            </div>
        </div>

        <!-- Photo Gallery -->
        <section class="gallery-section">
            <h2>Our Memories</h2>
            <div class="gallery-grid">
                <img src="photo1.jpg" alt="Memory 1">
                <img src="photo2.jpg" alt="Memory 2">
                <img src="photo3.jpg" alt="Memory 3">
                <img src="photo4.jpg" alt="Memory 4">
                <img src="photo5.jpg" alt="Memory 5">
            </div>
        </section>
    </div>

    <script>
        // YOUR ORIGINAL MESSAGE WITH TYPEWRITER EFFECT
        const messageText = "My Beautiful Ghadii,\n\nSince you entered my life, you have become the owner of my heart. If my behavior changed recently, it was only because I wanted to see if our love had changed you—and I am so happy to see that you love me even more each day. You are my Queen, my peace, my smile, and my forever. No matter what happens, I choose you today, tomorrow, and forever!";
        
        let index = 0;
        const speed = 40;

        function startTypewriter() {
            const textContainer = document.getElementById("typewriter-text");
            if (textContainer && index < messageText.length) {
                const char = messageText.charAt(index);
                if (char === '\n') {
                    textContainer.innerHTML += '<br>';
                } else {
                    textContainer.innerHTML += char;
                }
                index++;
                setTimeout(startTypewriter, speed);
            }
        }

        startTypewriter();

        // AUDIO TOGGLE
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle');

            if (!music) return;

            if (music.paused) {
                music.play().then(() => {
                    if (btn) btn.textContent = '⏸️ Pause Music';
                }).catch(err => {
                    console.log('Audio playback prevented:', err);
                });
            } else {
                music.pause();
                if (btn) btn.textContent = '🎵 Play Music';
            }
        }

        // SURPRISE POPUP
        function openSurprise() {
            const modal = document.getElementById('surprise-modal');
            if (modal) {
                modal.style.display = 'flex';
            }

            const music = document.getElementById('bg-music');
            if (music && music.paused) {
                toggleMusic();
            }
        }

        function closeSurprise() {
            const modal = document.getElementById('surprise-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('surprise-modal');
            if (event.target === modal) {
                closeSurprise();
            }
        });
    </script>
</body>
</html>
